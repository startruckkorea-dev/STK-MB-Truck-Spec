name: Supabase Keep Alive

on:
  schedule:
    # 매일 UTC 0시 (KST 오전 9시) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (write)
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X PATCH \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/health_check?id=eq.1")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Ping failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Ping successful (write confirmed)"
