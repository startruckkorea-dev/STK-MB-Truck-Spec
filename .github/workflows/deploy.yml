name: Deploy to Vercel (Production)

# main 브랜치에 push 되면 Vercel CLI 로 운영 배포한다.
# Vercel 자체 Git 연동 대신 CLI 토큰 방식이라, 이 저장소(push 대상)에서 그대로 동작한다.
# 필요한 설정: GitHub 저장소 Secret 에 VERCEL_TOKEN 1개만 등록.

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행 버튼

# Org/Project ID 는 민감정보가 아님 (.vercel/project.json 값과 동일)
env:
  VERCEL_ORG_ID: team_sQlJ98G0q3xtZ7dOX7xBEAHm
  VERCEL_PROJECT_ID: prj_o2xWoAR5fT6DjSY9O06AYrXgdQcX

concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt) to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
